<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aevrik</title></head>
<body><a class="skip-link" href="#main">Skip to workspace</a>
<div class="app-window"><header class="titlebar" data-tauri-drag-region>
<div class="window-title" data-tauri-drag-region><img src="../assets/mark.svg" width="20" height="20" alt=""><strong>Aevrik</strong></div>
<div class="titlebar-nav"><nav id="navigation" aria-label="Main navigation"></nav><button class="nav-item" data-nav="settings">Settings</button></div>
<span id="breadcrumb" class="sr-only" aria-live="polite">Projects</span><div class="titlebar-space" data-tauri-drag-region></div>
<button class="nav-search" data-action="search" aria-label="Search and commands" title="Search and commands (Ctrl K)"><span data-icon="search"></span><span>Search or run a command</span><kbd>Ctrl K</kbd></button>
<button class="icon-button" data-action="theme" aria-label="Change appearance" title="Change appearance"><span data-icon="sun"></span></button><div class="caption-controls" aria-label="Window controls">
<button data-window="minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M1 6.5h10"/></svg></button>
<button data-window="maximize" aria-label="Maximize or restore"><svg viewBox="0 0 12 12"><path d="M1.5 1.5h9v9h-9z"/></svg></button>
<button class="caption-close" data-window="close" aria-label="Close to system tray" title="Close to system tray — services keep running"><svg viewBox="0 0 12 12"><path d="m1.5 1.5 9 9m0-9-9 9"/></svg></button></div></header>
<div class="shell"><div id="connection-error" class="connection-error" role="alert" hidden></div><main id="main" tabindex="-1"><div class="empty">Connecting to the desktop engine…</div></main></div>
<footer class="statusbar"><span id="service-count">Connecting…</span><span id="exited-count" class="status-exited" hidden></span><span class="status-context"><kbd>Ctrl K</kbd>Search and commands</span><span class="status-end"><span id="engine-status">Engine starting</span><span class="status-divider"></span><span class="preview-label" id="app-version">Desktop</span></span></footer></div>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div><script type="module" src="./main.ts"></script></body></html>
